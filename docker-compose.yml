
services:
  db:
    image: postgres
    container_name: postgres-db

    env_file:
      - .env
    
    ports:
     - "5432:5432"
    
    volumes:
     - pgdata:/var/lib/postgresql
    
  web:
    build: .
    container_name: django-api

    ports:
     - "8000:8000"
    
    
    env_file:
      - .env

    
    depends_on:
     - db
  
volumes:
 pgdata:

  